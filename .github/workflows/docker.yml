name: docker

# Tagging convention (Docker Hub: ludwin20/netutils)
#   push to main (image changed) -> latest, sha-<short>
#   git tag vX.Y.Z           -> X.Y.Z, X.Y, X, latest
#   pull request             -> build + test only, nothing pushed
# Docker Hub immutability should cover only X.Y.Z and sha-* (each pushed exactly once);
# latest, X.Y and X are moving tags.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]          # path filters are not evaluated for tag pushes
    paths:
      - Dockerfile
      - .dockerignore
      - tcping/**
      - test.sh
      - .github/workflows/docker.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - tcping/**
      - test.sh
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ludwin20/netutils
  PLATFORMS: linux/amd64,linux/arm64
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  # Releases build from scratch so `apk add` always installs the newest patched packages.
  NO_CACHE: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload Trivy SARIF to code scanning
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            # sha-* comes from the main run only; a release re-pushing it would hit immutability
            type=sha,prefix=sha-,enable=${{ github.ref_type == 'branch' }}
            type=ref,event=pr

      - name: Build test image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: netutils:test
          no-cache: ${{ env.NO_CACHE == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Self-test
        # GitHub-hosted runners block outbound ICMP, so ping/traceroute are skipped here.
        run: docker run --rm -e SKIP_ICMP=1 netutils:test netutils-test

      - name: Vulnerability scan (full report)
        run: |
          mkdir -p "$HOME/.cache/trivy"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" -v "$PWD:/out" "$TRIVY_IMAGE" \
            image --quiet --scanners vuln --format sarif -o /out/trivy.sarif netutils:test

      - name: Upload scan to GitHub code scanning
        if: github.event_name != 'pull_request' && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: image-build

      - name: Vulnerability gate (fixable HIGH/CRITICAL)
        # Fails the build, before anything is pushed, if a fix exists for any HIGH/CRITICAL finding.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY_IMAGE" \
            image --quiet --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --exit-code 1 --format table netutils:test

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (multi-arch)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ env.NO_CACHE == 'true' }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Pushed ${{ env.IMAGE }} (${{ env.PLATFORMS }})"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
